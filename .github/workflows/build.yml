name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool m4 gettext pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Fabriquer l'APK
        run: |
          CODE=0
          yes | buildozer -v android debug > log.txt 2>&1 || CODE=$?
          {
            echo "## Erreurs trouvées"
            echo '```'
            grep -i -E "error|failed|traceback|exception" log.txt | tail -n 40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: Déposer le journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-complet
          path: log.txt

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: niohub-test-apk
          path: bin/*.apk
