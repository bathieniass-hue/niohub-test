name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Donner les droits au dossier
        run: sudo chmod -R 777 .

      - name: Fabriquer l'APK
        run: |
          docker run --rm --volume "$(pwd)":/home/user/hostcwd kivy/buildozer android debug

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: niohub-test-apk
          path: bin/*.apk
