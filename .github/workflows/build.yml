name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool m4 gettext pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          python -m pip install buildozer==1.5.0 cython==0.29.33

      - name: Fabriquer l'APK
        run: |
          set +e
          buildozer -v android debug > log.txt 2>&1
          CODE=$?
          {
            echo "## Fin du journal de fabrication"
            echo '```'
            tail -n 60 log.txt | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: Déposer le journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-complet
          path: log.txt

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: niohub-test-apk
          path: bin/*.apk
