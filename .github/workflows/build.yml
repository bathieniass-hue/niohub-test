name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fabriquer l'APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: niohub-test-apk
          path: ${{ steps.buildozer.outputs.filename }}
