name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool m4 gettext pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Fabriquer l'APK
        run: |
          yes | buildozer -v android debug

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: niohub-test-apk
          path: bin/*.apk
