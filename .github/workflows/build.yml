name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool m4 gettext pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Fabriquer l'APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -n 60 > erreur.txt || true
          cat erreur.txt

      - name: Déposer le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-erreur
          path: erreur.txt
